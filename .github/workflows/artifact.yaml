name: artifact yaml
on:
  workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Create a file to upload as an artifact
              run: |
                echo "This is a test artifact by Sunder." > artifact.txt
                echo "Artifact created at $(date +%T)"
            - name: Upload the artifact
              uses: actions/upload-artifact@v7
              with:
                name: my-artifact
                path: artifact.txt
                retention-days: 7              
                if-no-files-found: error 
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Download the artifact
              uses: actions/download-artifact@v8
              with:
                name: my-artifact
            - name: Display the artifact content
              run: |
                echo "Artifact content:"
                cat artifact.txt
    publish-logs-on-failure:
        needs: [build, test]
        runs-on: ubuntu-latest
        steps:
            - run: |
                mkdir -p logs
                echo "diagnostics for run ${{ github.run_id }}" > logs/debug.log
            - uses: actions/upload-artifact@v7
              with:
                name: failure-logs
                path: logs/
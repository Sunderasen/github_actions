name: 11 - Setup Node

on: workflow_dispatch

jobs:
  node-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Confirm the versions
        run: |
          docker --version
          node --version
          npm --version
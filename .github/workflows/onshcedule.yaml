name: 06 - Scheduled Run

on:
  schedule:
    - cron: '57 7 * * *'      
    // This cron expression means the workflow will run at 07:57 UTC every day. Adjust the time as needed.

jobs:
  scheduled-task:
    runs-on: ubuntu-latest
    steps:
      - name: Nightly housekeeping
        run: echo "Running scheduled job at $(date -u)"